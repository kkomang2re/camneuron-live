# 릴리즈 APK를 GitHub에서 빌드해 Releases에 올린다. PC 없이 폰에서 내려받아 설치하려는 것이다.
#
# 언제 도는가:
#   - main에 올라올 때 (태그 build-<번호>로 올라간다)
#   - claude/release-apk-로 시작하는 가지에 올라올 때 (main에 합치기 전에 낼 때. 마찬가지로 build-<번호>)
#   - apk-로 시작하는 태그를 올릴 때 (그 태그 이름으로 올라간다)
#   - Actions 화면에서 직접 실행할 때
#
# 서명:
#   - 저장소 Secrets에 RELEASE_SIGNING이 있으면 그 키로 서명한다. 값은 keystore.properties와
#     keystore/camneuron-live-release.jks를 묶은 것이다:
#       tar -cz keystore.properties keystore/camneuron-live-release.jks | base64 -w0
#     이때는 빌드마다 서명이 같아서 깔린 앱 위에 새 빌드를 덮어 깔 수 있다. 서명이 EXPECTED_CERT(폰에 깔린 앱의
#     키)와 다르면 빌드를 실패시킨다: 다른 키로 서명한 것은 올려 봐야 덮어 깔 수 없다.
#   - 예전 방식: RELEASE_KEYSTORE_BASE64(키 파일을 base64로 바꾼 것)와 RELEASE_KEYSTORE_PASSWORD. 키의 별칭은
#     camneuron-live, 키 비밀번호는 저장소 비밀번호와 같아야 한다.
#   - 둘 다 없으면 이번 빌드에서만 쓰는 임시 키로 서명한다. 설치는 되지만 빌드마다 서명이 달라서, 다음 빌드는
#     앱을 지우고 다시 깔아야 한다 (폰에 저장한 설정이 지워진다).
#   키와 비밀번호는 저장소에 넣지 않는다.
name: APK 빌드

on:
  push:
    branches: [main, "claude/release-apk-*"]
    tags: ["apk-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_BUNDLE: ${{ secrets.RELEASE_SIGNING }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      # 릴리즈 서명 키의 인증서 지문 (비밀이 아니다). 고정 키로 서명한 빌드는 이 값과 같아야 한다.
      EXPECTED_CERT: 93490ed6bb4853d0c3011cc157289907ce80cfa2e1ae313a938894d07ef81914
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        run: |
          mkdir -p keystore
          if [ -n "$SIGNING_BUNDLE" ]; then
            # 붙여 넣다 섞인 공백·줄바꿈은 지운다. 묶음 안의 두 파일만 꺼낸다.
            if ! printf '%s' "$SIGNING_BUNDLE" | tr -d '[:space:]' | base64 -d | tar -xz keystore.properties keystore/camneuron-live-release.jks; then
              echo "::error::RELEASE_SIGNING 값을 풀 수 없습니다. 값을 처음부터 끝까지 다시 붙여 넣어 등록하세요."
              exit 1
            fi
            echo "SIGNING=fixed" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/camneuron-live-release.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "SIGNING=fixed" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore keystore/camneuron-live-release.jks \
              -storepass "$PASS" -keypass "$PASS" -alias camneuron-live \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CamNeuron Live (temporary build key)"
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
          fi
          {
            echo "storeFile=keystore/camneuron-live-release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=camneuron-live"
            echo "keyPassword=$PASS"
          } > keystore.properties

      - name: 릴리즈 APK 빌드
        run: bash ./gradlew assembleRelease --stacktrace

      - name: 서명 확인, 이름 정하기
        run: |
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          APK="CamNeuronLive-${VERSION}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"
          if [ "$SIGNING" = "fixed" ]; then
            CERT="$("${BUILD_TOOLS}apksigner" verify --print-certs "$APK" | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | head -1)"
            if [ "$CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::서명 키가 폰에 깔린 앱의 키와 다릅니다 (지문 $CERT). Secrets의 서명 키를 확인하세요."
              exit 1
            fi
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="build-${{ github.run_number }}"; fi
          if [ "$SIGNING" = "fixed" ]; then
            NOTE="이전 빌드가 깔려 있으면 지우지 말고 그대로 덮어 설치합니다 (설정 유지)."
          else
            NOTE="임시 키로 서명한 빌드입니다. 처음 까는 폰에는 그대로 설치됩니다. 다른 빌드가 이미 깔려 있으면 덮어 깔 수 없어서, 앱을 지우고 다시 깔아야 합니다 (폰에 저장한 설정이 지워집니다)."
          fi
          {
            echo "VERSION=$VERSION"
            echo "APK=$APK"
            echo "TAG=$TAG"
            echo "NOTE=$NOTE"
          } >> "$GITHUB_ENV"

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 캠뉴런 라이브 ${{ env.VERSION }} (빌드 ${{ github.run_number }})
          body: |
            폰에서 아래 ${{ env.APK }} 를 눌러 내려받아 설치하세요.
            ${{ env.NOTE }}
          files: ${{ env.APK }}
          make_latest: "true"

      - name: 단위 테스트
        run: bash ./gradlew testReleaseUnitTest
